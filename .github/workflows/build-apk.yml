name: Build Rivera APK
on: [workflow_dispatch]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Generate Android folder
        run: flutter create --platforms=android --project-name rivera_attendance_v3 .
      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          P='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.USE_BIOMETRIC"/>'
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i "s|<application|$P<application|" "$M"
          grep -q ACCESS_FINE_LOCATION "$M" && echo OK || echo WARN
          exit 0
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: rivera-v3-apk, path: build/app/outputs/flutter-apk/app-release.apk, if-no-files-found: error}
      - name: Commit APK into repo (easy download)
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/rivera-attendance-v3.apk
          git config user.name rivera-bot
          git config user.email rivera-bot@users.noreply.github.com
          git add -f release/
          git diff --cached --quiet || git commit -m "APK build $(date +%Y%m%d-%H%M)"
          git pull --rebase origin main || true
          git push origin main
